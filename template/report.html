<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Healthcheck — PC-LUCAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:        oklch(8%  0.018 255);
  --surface:   oklch(12% 0.020 255);
  --surface2:  oklch(17% 0.020 255);
  --surface3:  oklch(21% 0.018 255);
  --border:    oklch(24% 0.020 255);
  --text:      oklch(93% 0.008 255);
  --text-dim:  oklch(50% 0.015 255);
  --text-mid:  oklch(72% 0.010 255);
  --critique:     oklch(65% 0.22  25); --critique-bg:  oklch(16% 0.07  25); --critique-brd: oklch(27% 0.10  25);
  --eleve:        oklch(80% 0.17  62); --eleve-bg:     oklch(17% 0.06  62); --eleve-brd:    oklch(28% 0.09  62);
  --moyen:        oklch(88% 0.20  82); --moyen-bg:     oklch(19% 0.06  82); --moyen-brd:    oklch(30% 0.11  82);
  --info:         oklch(70% 0.17 250); --info-bg:      oklch(17% 0.06 250); --info-brd:     oklch(28% 0.10 250);
  --green:        oklch(68% 0.17 145); --green-bg:     oklch(17% 0.06 145); --green-brd:    oklch(28% 0.10 145);
  --sidebar-w: 20vw; --right-w: 20vw;
  --font-mono: 'JetBrains Mono', monospace;
  --font-sans: 'Roboto', sans-serif;
}
[data-light] {
  --bg: oklch(96% 0.005 255); --surface: oklch(100% 0 0); --surface2: oklch(94% 0.006 255);
  --surface3: oklch(90% 0.006 255); --border: oklch(87% 0.008 255);
  --text: oklch(13% 0.015 255); --text-dim: oklch(48% 0.012 255); --text-mid: oklch(33% 0.012 255);
  --critique-bg: oklch(97% 0.03 25); --critique-brd: oklch(80% 0.12 25);
  --eleve-bg: oklch(97% 0.03 50); --eleve-brd: oklch(80% 0.10 50);
  --moyen-bg: oklch(97% 0.04 92); --moyen-brd: oklch(82% 0.13 92);
  --info-bg: oklch(96% 0.04 250); --info-brd: oklch(80% 0.10 250);
  --green-bg: oklch(96% 0.04 145); --green-brd: oklch(80% 0.10 145);
}
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font-sans); font-size: 14px; line-height: 1.6;
  min-height: 100vh; display: flex;
  transition: background 0.3s, color 0.3s;
}

/* ── SIDEBAR ── */
.sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w);
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; z-index: 100; overflow: hidden;
}
.sb-logo {
  padding: 18px 18px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.sb-logo-text {}
.sb-logo-eye { font-family: var(--font-sans); font-size: 9px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--green); margin-bottom: 2px; }
.sb-logo-name { font-size: 16px; font-weight: 700; font-family: var(--font-sans); }
.print-btn {
  flex-shrink: 0; padding: 6px 10px; border-radius: 7px; cursor: pointer;
  background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim);
  font-size: 11px; font-family: var(--font-sans); font-weight: 600;
  display: flex; align-items: center; gap: 5px; transition: all 0.15s; white-space: nowrap;
}
.print-btn:hover { background: var(--surface3); color: var(--text); border-color: var(--text-dim); }

/* Méta machine */
.sb-meta { padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
.sb-meta-row { display: flex; flex-direction: column; gap: 1px; }
.sb-meta-label { font-family: var(--font-sans); font-size: 14px; color: var(--text); font-weight: 600; }
.sb-meta-val   { font-family: var(--font-sans); font-size: 13px; font-weight: 400; color: var(--text-mid); }

/* Informations système */
.sb-sysinfo { padding: 10px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; }
.sb-sysinfo-title { font-family: var(--font-sans); font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px; }
.sb-sysinfo-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sb-sysinfo-key { font-size: 11px; color: var(--text-dim); font-family: var(--font-sans); white-space: nowrap; }
.sb-sysinfo-val { font-size: 11px; color: var(--text-mid); font-family: var(--font-sans); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Processus suspects */
.sb-procs-header {
  padding: 8px 18px 6px; flex-shrink: 0;
  font-family: var(--font-sans); font-size: 9px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.sb-procs-empty { padding: 8px 18px; font-size: 11.5px; color: var(--green); font-family: var(--font-sans); border-bottom: 1px solid var(--border); font-weight: 500; }
.proc-item { display: flex; align-items: flex-start; gap: 8px; padding: 7px 18px; border-bottom: 1px solid var(--border); cursor: default; }
.proc-item:last-of-type { border-bottom: 1px solid var(--border); }
.proc-sev-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
.proc-sev-dot.critique { background: var(--critique); }
.proc-sev-dot.eleve    { background: var(--eleve); }
.proc-sev-dot.moyen    { background: var(--moyen); }
.proc-body {}
.proc-name { font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--text); }
.proc-reason { font-size: 10.5px; color: var(--text-dim); font-family: var(--font-sans); line-height: 1.4; }

/* Alertes détectées */
.sb-todo-header {
  padding: 8px 18px 6px; flex-shrink: 0;
  font-family: var(--font-sans); font-size: 9px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.sb-todo-count { font-family: var(--font-sans); font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 8px; background: var(--surface2); color: var(--text-dim); }
.sb-todo-list { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 4px 0; }
.sb-todo-list::-webkit-scrollbar { width: 4px; }
.sb-todo-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.todo-item { display: flex; align-items: flex-start; gap: 10px; padding: 7px 18px; border-bottom: 1px solid var(--border); cursor: default; transition: background 0.12s; }
.todo-item:last-child { border-bottom: none; }
.todo-item:hover { background: var(--surface2); }
.todo-sev-bar { width: 3px; border-radius: 2px; flex-shrink: 0; align-self: stretch; min-height: 14px; margin-top: 3px; }
.todo-sev-bar.critique { background: var(--critique); }
.todo-sev-bar.eleve    { background: var(--eleve); }
.todo-sev-bar.moyen    { background: var(--moyen); }
.todo-sev-bar.info     { background: var(--info); }
.todo-text { font-size: 12.5px; color: var(--text-mid); line-height: 1.45; font-family: var(--font-sans); }

/* ── LAYOUT ── */
.main { margin-left: var(--sidebar-w); margin-right: var(--right-w); flex: 1; padding: 32px; min-width: 0; }
.right-panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: var(--right-w);
  background: var(--surface); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; overflow-y: auto; z-index: 100;
}
.rp-section { padding: 14px 16px 12px; border-bottom: 1px solid var(--border); }
.rp-section:last-child { border-bottom: none; }
.rp-title { font-family: var(--font-sans); font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; }

/* ── HÉROS SCORE ── */
.score-hero {
  display: grid; grid-template-columns: auto 1fr; gap: 36px; align-items: center;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 36px 40px; margin-bottom: 28px;
  position: relative; overflow: hidden;
}
.score-hero::before {
  content: ''; position: absolute; top: -80px; right: -60px; width: 280px; height: 280px; border-radius: 50%;
  background: radial-gradient(circle, oklch(68% 0.17 145 / 0.07) 0%, transparent 70%); pointer-events: none;
}
.score-ring-wrap { position: relative; flex-shrink: 0; }
.score-ring-wrap svg { display: block; transform: rotate(-90deg); }
.score-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.score-num { font-family: var(--font-mono); font-size: 52px; font-weight: 700; line-height: 1; }
.score-denom { font-family: var(--font-sans); font-size: 14px; color: var(--text-dim); margin-top: 2px; }
.score-right { display: flex; flex-direction: column; gap: 16px; }
.score-title { font-size: 22px; font-weight: 700; font-family: var(--font-sans); }
.score-sub { font-family: var(--font-sans); font-size: 10px; color: var(--text-dim); letter-spacing: 1px; margin-top: 2px; }
.sev-chips { display: flex; gap: 10px; flex-wrap: wrap; }
.sev-chip { display: flex; flex-direction: column; align-items: center; padding: 12px 20px; border-radius: 10px; border: 1px solid var(--border); min-width: 72px; transition: transform 0.15s; cursor: default; }
.sev-chip:hover { transform: translateY(-2px); }
.chip-n { font-family: var(--font-mono); font-size: 28px; font-weight: 700; line-height: 1; }
.chip-l { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); margin-top: 4px; font-weight: 600; font-family: var(--font-sans); }
.chip-critique { background: var(--critique-bg); border-color: var(--critique-brd) !important; } .chip-critique .chip-n { color: var(--critique); }
.chip-eleve    { background: var(--eleve-bg);    border-color: var(--eleve-brd) !important; }    .chip-eleve .chip-n    { color: var(--eleve); }
.chip-moyen    { background: var(--moyen-bg);    border-color: var(--moyen-brd) !important; }    .chip-moyen .chip-n    { color: var(--moyen); }
.chip-info     { background: var(--info-bg);     border-color: var(--info-brd) !important; }     .chip-info .chip-n     { color: var(--info); }

/* ── TITRES DE SECTION ── */
.section { margin-bottom: 32px; scroll-margin-top: 24px; }
.section-title { font-family: var(--font-sans); margin-bottom: 14px; display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-radius: 8px; background: var(--surface2); border: 1px solid var(--border); border-left-width: 4px; }
.st-label { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; flex: 1; }
.st-count { font-family: var(--font-mono); font-size: 22px; font-weight: 700; line-height: 1; }
.section-title.st-critique { border-left-color: var(--critique); } .section-title.st-critique .st-label, .section-title.st-critique .st-count { color: var(--critique); }
.section-title.st-eleve    { border-left-color: var(--eleve); }    .section-title.st-eleve .st-label,    .section-title.st-eleve .st-count    { color: var(--eleve); }
.section-title.st-moyen    { border-left-color: var(--moyen); }    .section-title.st-moyen .st-label,    .section-title.st-moyen .st-count    { color: var(--moyen); }
.section-title.st-info     { border-left-color: var(--info); }     .section-title.st-info .st-label,     .section-title.st-info .st-count     { color: var(--info); }
.section-title.st-neutral  { border-left-color: var(--text-dim); } .section-title.st-neutral .st-label   { color: var(--text-mid); }

/* ── CARTES D'ALERTES ── */
.alert-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; overflow: hidden; transition: border-color 0.2s; }
.alert-card:hover { border-color: var(--text-dim); }
.alert-header { display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px; cursor: pointer; user-select: none; }
.sev-bar { width: 3px; border-radius: 2px; flex-shrink: 0; align-self: stretch; min-height: 20px; }
.sev-bar.critique { background: var(--critique); } .sev-bar.eleve { background: var(--eleve); } .sev-bar.moyen { background: var(--moyen); } .sev-bar.info { background: var(--info); }
.alert-title-text { font-size: 13px; font-weight: 600; flex: 1; line-height: 1.5; font-family: var(--font-sans); color: var(--text); }
.alert-chevron { font-size: 10px; color: var(--text-dim); transition: transform 0.25s; flex-shrink: 0; margin-top: 3px; }
.alert-chevron.open { transform: rotate(180deg); }
.alert-body { padding: 0 18px 0 33px; overflow: hidden; max-height: 0; transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1), padding 0.25s; }
.alert-body.open { max-height: 440px; padding-bottom: 14px; }
.alert-desc { font-size: 13px; color: var(--text-mid); line-height: 1.75; margin-bottom: 12px; font-family: var(--font-sans); }
.alert-reco { background: var(--surface2); border: 1px solid var(--border); border-left: 3px solid var(--text-dim); border-radius: 6px; padding: 11px 13px; }
.reco-label { font-family: var(--font-sans); font-size: 8.5px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 5px; }
.reco-text { font-size: 12.5px; color: var(--text-mid); line-height: 1.7; font-family: var(--font-sans); }
code { font-family: var(--font-mono); font-size: 11.5px; background: var(--surface2); border: 1px solid var(--border); padding: 1px 6px; border-radius: 4px; color: var(--moyen); }

/* ── TABLEAUX ── */
.table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.data-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.data-table thead tr { border-bottom: 1px solid var(--border); }
.data-table th { padding: 11px 13px; font-family: var(--font-sans); font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-dim); text-align: left; white-space: nowrap; }
.data-table td { padding: 10px 13px; font-size: 13px; border-top: 1px solid var(--border); vertical-align: middle; overflow: hidden; }
.data-table tbody tr:hover td { background: var(--surface2); }
.mono { font-family: var(--font-mono); font-size: 12px; }
.abuse-chip { display: inline-flex; align-items: center; font-family: var(--font-mono); font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 5px; }
.abuse-ok   { background: var(--green-bg);    color: var(--green); }
.abuse-warn { background: var(--eleve-bg);    color: var(--eleve); }
.abuse-bad  { background: var(--critique-bg); color: var(--critique); }
.proc-tag { font-family: var(--font-mono); font-size: 11px; background: var(--surface2); border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px; color: var(--text-mid); display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note-text { font-size: 12px; color: var(--text-dim); font-family: var(--font-sans); }
.table-footnote { padding: 9px 13px; font-size: 11px; color: var(--text-dim); border-top: 1px solid var(--border); font-style: italic; font-family: var(--font-sans); }

/* ── PANNEAU DROIT ── */
.disk-item-sm { margin-bottom: 12px; } .disk-item-sm:last-child { margin-bottom: 0; }
.disk-meta-sm { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
.disk-label-sm { font-size: 12px; font-weight: 600; font-family: var(--font-sans); }
.disk-stat-sm { font-family: var(--font-sans); font-size: 11px; color: var(--text-dim); font-weight: 700; }
.disk-bar { height: 6px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.disk-fill { height: 100%; border-radius: 3px; transition: width 1.2s cubic-bezier(0.4,0,0.2,1); }
.fill-ok { background: var(--green); } .fill-warn { background: var(--moyen); } .fill-danger { background: var(--critique); }
.health-drive { margin-bottom: 13px; padding-bottom: 13px; border-bottom: 1px solid var(--border); }
.health-drive:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
.health-drive-name { font-size: 11.5px; font-weight: 600; color: var(--text); margin-bottom: 6px; font-family: var(--font-sans); line-height: 1.4; }
.smart-row { display: flex; flex-wrap: wrap; gap: 4px; }
.smart-dot { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-sans); font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 5px; border: 1px solid; }
.smart-dot.has-tip { cursor: help; }
.smart-ok      { background: var(--green-bg);    color: var(--green);    border-color: var(--green-brd); }
.smart-warn    { background: var(--moyen-bg);    color: var(--moyen);    border-color: var(--moyen-brd); }
.smart-crit    { background: var(--critique-bg); color: var(--critique); border-color: var(--critique-brd); }
.smart-neutral { background: var(--surface2);    color: var(--text-mid); border-color: var(--border); }
.smart-dot-icon { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.rp-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--border); }
.rp-row:last-child { border-bottom: none; }
.rp-row-label { font-size: 12px; color: var(--text-mid); font-family: var(--font-sans); }
.rp-row-val { font-family: var(--font-sans); font-size: 11px; color: var(--text-dim); text-align: right; max-width: 55%; }
.update-item-sm { padding: 7px 0; border-bottom: 1px solid var(--border); }
.update-item-sm:last-of-type { border-bottom: none; }
.update-name-sm { font-size: 12px; font-weight: 500; color: var(--text); font-family: var(--font-sans); }
.update-meta-sm { font-family: var(--font-sans); font-size: 10px; color: var(--text-dim); margin-top: 2px; }
.no-critical { text-align: center; padding: 9px 0; font-size: 11.5px; color: var(--green); font-family: var(--font-sans); font-weight: 500; }
.port-item { display: flex; align-items: center; gap: 9px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.port-item:last-child { border-bottom: none; }
.port-badge { font-family: var(--font-mono); font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 5px; flex-shrink: 0; background: var(--info-bg); color: var(--info); border: 1px solid var(--info-brd); white-space: nowrap; min-width: 44px; text-align: center; cursor: default; }
.port-proc { font-family: var(--font-mono); font-size: 10px; color: var(--text-mid); flex: 1; }
.port-note { font-size: 10px; color: var(--text-dim); font-family: var(--font-sans); font-style: italic; }

/* ── INFOBULLE PORTAIL ── */
.portal-tip {
  position: fixed; z-index: 9999; pointer-events: none;
  background: var(--surface3); border: 1px solid var(--border);
  color: var(--text-mid); font-size: 11px; font-family: var(--font-sans); font-weight: 400;
  padding: 7px 11px; border-radius: 7px; line-height: 1.6;
  max-width: 280px; white-space: pre-line;
  box-shadow: 0 4px 16px oklch(0% 0 0 / 0.4);
}

/* ── IMPRESSION PDF ── */
@media print {
  @page { margin: 14mm 12mm; }
  .sidebar, .right-panel, .print-btn { display: none !important; }
  .main { margin: 0 !important; padding: 0 !important; }
  body { background: #fff !important; color: #111 !important; font-size: 12px; }
  .score-hero, .alert-card, .table-card { break-inside: avoid; border: 1px solid #ddd !important; background: #fff !important; }
  .alert-body { max-height: none !important; padding-bottom: 12px !important; }
  .alert-chevron { display: none !important; }
  .section-title { background: #f4f4f4 !important; border-color: #ccc !important; }
  .data-table td, .data-table th { border-color: #ddd !important; }
}

@media (max-width: 1100px) { .right-panel { display: none; } .main { margin-right: 0; } }
@media (max-width: 768px)  { .sidebar { display: none; } .main { margin-left: 0; padding: 20px; } .score-hero { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

function scoreColor(s) {
  if (s >= 90) return 'oklch(50% 0.18 145)';

  if (s >= 50) return 'oklch(84% 0.19  92)';
  if (s >= 30) return 'oklch(76% 0.18  50)';
  return 'oklch(65% 0.22  25)';
}
function scoreLabel(s) {

function Tip({ text, children, className, style }) {
  const [pos, setPos] = useState(null);
  const ref = useRef(null);
  const show = () => {
    if (!ref.current) return;
    const r = ref.current.getBoundingClientRect();
    setPos({ right: window.innerWidth - r.right, bottom: window.innerHeight - r.top + 8 });
  };
  return (
    <>
      <span ref={ref} className={className} style={style} onMouseEnter={show} onMouseLeave={() => setPos(null)}>
        {children}
      </span>
      {pos && ReactDOM.createPortal(
        <div className="portal-tip" style={{ right: pos.right, bottom: pos.bottom }}>{text}</div>,
        document.body
      )}
    </>
  );
}

const ScoreRing = React.memo(function ScoreRing({ score }) {
  const SIZE = 170, r = 72, sw = 10, cx = 85, cy = 85;
  const circ = 2 * Math.PI * r;
  const target = circ - circ * score / 100;
  const color = scoreColor(score);
  const arcRef = useRef(null), numRef = useRef(null);
  useEffect(() => {
    const arc = arcRef.current, num = numRef.current;
    if (!arc || !num) return;
    arc.style.transition = 'none'; arc.style.stroke = color;
    arc.style.strokeDasharray = circ; arc.style.strokeDashoffset = circ;
    num.textContent = '0'; num.style.color = color;
    const t1 = setTimeout(() => {
      arc.style.transition = `stroke-dashoffset 1600ms cubic-bezier(0.4,0,0.2,1)`;
      arc.style.strokeDashoffset = target;
      arc.addEventListener('transitionend', () => { num.textContent = score; }, { once: true });
    }, 50);
    const t2 = setTimeout(() => { num.textContent = score; }, 1900);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, []);
  return (
    <div className="score-ring-wrap" style={{ width: SIZE, height: SIZE }}>
      <svg width={SIZE} height={SIZE} viewBox={`0 0 ${SIZE} ${SIZE}`}>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--surface2)" strokeWidth={sw} />
        <circle ref={arcRef} cx={cx} cy={cy} r={r} fill="none" strokeWidth={sw} strokeLinecap="round"
          style={{ strokeDasharray: circ, strokeDashoffset: circ, stroke: color }} />
      </svg>
      <div className="score-center">
        <div className="score-num" ref={numRef} style={{ color }}>0</div>
        <div className="score-denom">/100</div>
      </div>
    </div>);
});

function tempStyle(t) {
  const pct = Math.max(0, Math.min(1, (t - 28) / 32));
  if (pct < 0.5) {
    const p = pct / 0.5;
    return { background: `oklch(${17 + p*2}% ${0.06} ${145 - p*63})`, color: `oklch(${68 - p*12}% 0.17 ${145 - p*63})`, borderColor: `oklch(${28 - p*2}% 0.10 ${145 - p*54})` };
  }
  const p = (pct - 0.5) / 0.5;
  return { background: `oklch(${19 - p*3}% 0.07 ${82 - p*57})`, color: `oklch(${56 + p*9}% ${0.18 + p*0.04} ${82 - p*57})`, borderColor: `oklch(26% ${0.09} ${82 - p*57})` };
}

function SmartDot({ field, value }) {
  if (field === 'temp') {
    return (
      <span className="smart-dot" style={tempStyle(value)}>
        <span className="smart-dot-icon" />Temp: {value}°C
      </span>);
  }
  const cls = value === 0 ? 'smart-ok' : value <= 5 ? 'smart-warn' : 'smart-crit';
  const labels = { reallocated: 'Réalloués', pending: 'Pending', uncorrectable: 'Non corr.' };
  return (
    <Tip text={SMART_TIPS[field]} className={`smart-dot has-tip ${cls}`}>
      <span className="smart-dot-icon" />{labels[field]}: {value}
    </Tip>);
}
